name: Deploy LVG stable release

# Deploys main to lvg.open-regels.nl. This is not a required check, so its path
# filter can stay on the triggers.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    name: Build and deploy stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test
      # Built here, from the tree `npm ci` installed, so the lockfile decides
      # what ships.
      - name: Build
        # Build provenance for the footer: passed in from the workflow, never derived
        # from git at build time. On a pull request github.sha is the merge commit
        # GitHub creates, so a preview's SHA is not in the branch history.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
          VITE_SITE_URL: https://lvg.open-regels.nl
        run: |
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html not found after build"; exit 1; }
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MEADOW_08A367D03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: 'upload'
          # With skip_app_build, app_location is the built output itself.
          app_location: '/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
