name: Deploy toestemming wireframes

# Publishes docs/Wireframes as it is to toestemming.open-regels.nl. There is no
# build step.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/Wireframes/**'
      - '.github/workflows/azure-toestemming-wireframes.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'docs/Wireframes/**'

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    name: Deploy wireframes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TOESTEMMING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: 'upload'
          app_location: 'docs/Wireframes'
          api_location: ''
          output_location: ''
          skip_app_build: true
