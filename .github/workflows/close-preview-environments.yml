name: Close preview environments

# Deletes the preview environment a deploy workflow built for a pull request when
# that pull request closes, merged or not.
#
# This has no path filter, because the deploy workflows' filters would also skip
# the `closed` event. Closing an environment that was never created succeeds and
# does nothing.
#
# GitHub does not run pull_request workflows while a pull request has a merge
# conflict, and that includes `closed`. Previews left behind that way are found
# by `npm run check-previews`.
on:
  pull_request:
    types: [closed]
    branches:
      - acc
      - main

permissions: {}

jobs:
  close_acc_preview:
    if: github.event.pull_request.base.ref == 'acc'
    permissions: {}
    runs-on: ubuntu-24.04
    name: Close ACC preview
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LVG_ACC }}
          action: 'close'

  close_stable_preview:
    if: github.event.pull_request.base.ref == 'main'
    permissions: {}
    runs-on: ubuntu-24.04
    name: Close stable preview
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_MEADOW_08A367D03 }}
          action: 'close'

  close_wireframes_preview:
    if: github.event.pull_request.base.ref == 'main'
    permissions: {}
    runs-on: ubuntu-24.04
    name: Close wireframes preview
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TOESTEMMING }}
          action: 'close'
